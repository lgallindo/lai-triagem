[project]
name = "lai-triagem"
version = "0.1.0"
description = "Triagem de risco de reencaminhamento de pedidos LAI na plataforma Fala.BR"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Gallindo Martins Soares", email = "lgms@cesar.org.br" }]
keywords = ["lai", "fala.br", "cgu", "transparencia", "triagem", "lightgbm", "bentoml"]

# Versões fixadas nas que foram efetivamente usadas no treinamento registrado
# em docs/TREINAMENTO.md. Trocar qualquer uma delas invalida a reprodução exata.
#
# EXPERIMENTO FEATURETOOLS — `pandas` recuou de 3.0.5 para 2.3.3, e não por
# escolha. O Featuretools guarda o esquema das tabelas num acessor do pandas
# (`df.ww`), do pacote `woodwork`. Em pandas 3.0.5 esse estado **não
# sobrevive**: `df.ww.init(...)` roda sem erro e, na linha seguinte,
# `df.ww.schema` é `None`. A primeira chamada de `add_dataframe` morre com
# `WoodworkNotInitError`. Não há como usar a biblioteca na pilha atual.
#
# `setuptools<81` porque o `woodwork` importa `pkg_resources` no topo do
# módulo, e o setuptools 81 o removeu. Dependência de uma API que a própria
# comunidade aposentou.
#
# Que a reprodução exata sobrevive ao recuo foi VERIFICADO antes de escrever
# qualquer linha: `scripts/train.py` sem alteração nenhuma, sob py3.12 +
# pandas 2.3.3, devolve os mesmos 0,1901 de PR-AUC e 24,23% de precisão@5%.
dependencies = [
    "lightgbm==4.7.0",
    "pandas==2.3.3",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "pyarrow==25.0.1",
    "featuretools==1.31.0",
    "setuptools<81",
]

[project.optional-dependencies]
# Só necessário para servir o modelo; o treinamento e o exemplo mínimo não usam.
serve = [
    "bentoml==1.4.39",
    "pydantic==2.13.5",
]

[project.urls]
Repository = "https://github.com/lgallindo/lai-triagem"
"Fonte dos dados" = "https://dadosabertos-download.cgu.gov.br/FalaBR/Arquivos_FalaBR/"

[tool.uv]
# O ambiente é gerido por uv. Não editar à mão nem usar pip diretamente.
package = false

[tool.ruff]
# 100 colunas, e não as 88 padrão, porque este código foi escrito assim: a 88
# seriam 183 violações e a 100 são 30. Reformatar 183 linhas que não estão
# erradas só produziria ruído no diff e esconderia as correções de verdade.
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "artifacts"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I ordenação de imports, B bugbear,
# UP modernização, SIM simplificação, C4 comprehensions.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
# C408 (`dict(a=1)` em vez de `{"a": 1}`) fica desligada de propósito. Os usos
# aqui são listas de parâmetro — `READ_KW = dict(sep=";", encoding="utf-16",
# ...)` e os hiperparâmetros do LightGBM — e a forma com palavra-chave lê-se
# melhor que o literal com aspas. Desligada por escolha declarada, não por
# preguiça: as outras 41 foram corrigidas, não silenciadas.
ignore = ["C408"]

[tool.ruff.lint.per-file-ignores]
# Os scripts de verificação imprimem tabelas largas; quebrar a string só para
# caber piora a leitura de quem confere o número contra a saída.
"scripts/verify_*.py" = ["E501"]

[tool.pytest.ini_options]
# `test_metrics.py` e `test_guardas.py` ainda são scripts com `assert` manual,
# executáveis por `uv run python`. Esta seção existe para que a migração para
# pytest não precise mexer em configuração depois.
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["lai_triagem", "service.py"]
# Começo deliberadamente frouxo: o objetivo da primeira passada é não ter erro
# de verdade, não anotar tudo. Apertar depois, módulo a módulo.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
